name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: App (tests, debug, release, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:domain:test :core:online:test :app:testDebugUnitTest --stacktrace
      - name: Build debug and release (R8)
        run: ./gradlew :app:assembleDebug :app:assembleRelease -Parrow3d.rankingUrl=https://ranking.example.com --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  server:
    name: Ranking server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew -p server test --stacktrace
      - name: Docker image builds
        run: docker build -f server/Dockerfile -t arrow3d-ranking .
